# Render blueprint for the Tejas API.
# Render > New > Blueprint, point it at this repo and branch v2.
services:
  - type: web
    name: tejas-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required: typescript and the prisma CLI are
    # devDependencies, and Render builds with NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # set in the dashboard - never commit
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false        # your https://<project>.vercel.app
      - key: SALON_WHATSAPP_NUMBER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
